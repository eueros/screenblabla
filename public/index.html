<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScreenShare</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#eef1f4;--ink:#14202b;--mute:#5b6b7a;--line:#d5dce3;--acc:#2457f5;--acc-ink:#fff;--stage:#0e141b;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#10161d;--ink:#e8edf2;--mute:#8fa0b0;--line:#26323e;--card:#17202a;--stage:#070b10}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:.6rem 1rem}
button.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);font-weight:600}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hidden{display:none!important}
.center{min-height:100%;display:grid;place-content:center;gap:1.25rem;padding:2rem;text-align:center;justify-items:center}
.center h1{font-size:clamp(2.4rem,8vw,4.5rem);letter-spacing:-.03em;line-height:1}
.center p{margin:0;color:var(--mute);max-width:34ch}
.err{color:#c0392b}
#room{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h2{font-size:1.25rem;margin-right:auto}
#count{font-weight:600}
main{flex:1;min-height:0;padding:1rem;overflow:auto}
#grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.tile{background:var(--stage);border-radius:10px;overflow:hidden;position:relative;aspect-ratio:16/9}
.tile video{width:100%;height:100%;object-fit:contain;display:block}
.tile.sel{outline:2px solid var(--acc);outline-offset:-2px}
.tile:fullscreen{aspect-ratio:auto;border-radius:0;outline:none}
.tile .who{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:.5rem .75rem;color:#fff;font-size:.9rem;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.ctl{position:absolute;top:.5rem;right:.5rem;display:flex;gap:.35rem;opacity:0;transition:opacity .15s}
.tile:hover .ctl,.tile:focus-within .ctl{opacity:1}
@media (hover:none){.ctl{opacity:1}}
.ctl button{padding:.25rem .6rem;font-size:.82rem;background:rgba(0,0,0,.6);color:#fff;border-color:rgba(255,255,255,.25)}
.qual{position:absolute;top:.5rem;left:.5rem;display:flex;align-items:center;gap:.35rem;padding:.15rem .55rem;border-radius:99px;background:rgba(0,0,0,.55);color:#fff;font-size:.78rem}
.qual i{width:8px;height:8px;border-radius:50%;background:#2fb36b}
.qual.warn i{background:#e5a100}.qual.bad i{background:#d64545}
#grid.focused{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.tile.big{order:-1}
#grid.focused .tile.big{grid-column:1/-1;max-height:calc(100vh - 300px)}
#exitCinema{display:none;position:fixed;top:.5rem;right:.5rem;z-index:5;opacity:.35}
#exitCinema:hover,#exitCinema:focus-visible{opacity:1}
body.cinema header,body.cinema footer{display:none}
body.cinema main{padding:.5rem;display:flex;flex-direction:column}
body.cinema #exitCinema{display:block}
body.cinema #grid{flex:1;min-height:0;grid-auto-rows:1fr}
body.cinema .tile{aspect-ratio:auto}
body.cinema #grid.focused{grid-template-rows:1fr;grid-auto-rows:120px}
body.cinema #grid.focused .tile.big{max-height:none}
#empty{height:100%;display:grid;place-content:center;gap:1rem;text-align:center;justify-items:center;color:var(--mute)}
footer{padding:.75rem 1rem;border-top:1px solid var(--line);display:flex;gap:.75rem;justify-content:center}
</style>
</head>
<body>

<section id="home" class="center hidden">
  <h1>ScreenShare</h1>
  <p>Crie uma sala, envie o link e compartilhem as telas. Sem conta, sem limite de tempo.</p>
  <button id="create" class="primary">Criar sala</button>
  <p id="homeMsg" class="err"></p>
</section>

<section id="blocked" class="center hidden">
  <h1>Ops</h1>
  <p id="blockedMsg"></p>
  <button onclick="location.href='/'">Voltar ao início</button>
</section>

<section id="room" class="hidden">
  <header>
    <h2>ScreenShare</h2>
    <span id="count">👥 1/15 pessoas</span>
    <button id="copy">Copiar link</button>
    <button id="cinema">Modo cinema</button>
    <button id="leave">Sair da sala</button>
  </header>
  <main>
    <div id="empty">
      <p>Ninguém está compartilhando a tela.</p>
      <button class="primary" data-share>Compartilhar minha tela</button>
    </div>
    <div id="grid" class="hidden"></div>
    <button id="exitCinema">Sair do cinema (Esc)</button>
  </main>
  <footer>
    <button id="shareBtn" class="primary" data-share>Compartilhar minha tela</button>
    <button id="stopBtn" class="hidden">Parar meu compartilhamento</button>
  </footer>
</section>

<script>
const MAX = 15;
const $ = s => document.querySelector(s);
const show = id => { for (const s of ['home','blocked','room']) $('#'+s).classList.toggle('hidden', s !== id); };
const match = location.pathname.match(/^\/r\/([a-z0-9]+)$/);

if (!match) {
  show('home');
  $('#create').onclick = async () => {
    try {
      const r = await fetch('/api/rooms', { method: 'POST' });
      const { code } = await r.json();
      location.href = '/r/' + code;
    } catch { $('#homeMsg').textContent = 'Não foi possível criar a sala. Tente de novo.'; }
  };
} else {
  joinRoom(match[1]);
}

function joinRoom(code) {
  const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
  // Degraus de adaptação: 0 é o alvo (1080p60); desce sob congestionamento e sobe devagar quando melhora
  const TIERS = [{ h: 1080, fps: 60, br: 8e6 }, { h: 1080, fps: 60, br: 5e6 }, { h: 1080, fps: 30, br: 3.5e6 }, { h: 720, fps: 30, br: 2e6 }, { h: 540, fps: 30, br: 1.2e6 }];
  const mk = (name, share) => ({ name, share, senders: [], level: 0, bad: 0, good: 0, need: 10, upAt: 0, prev: {}, resetAt: 0 });
  const peers = new Map();
  let myId, myName, ws, localStream = null, myShare = null, capH = 1080, left = false, focusKey = null, selKey = null;

  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?room=' + code);
  const wsSend = o => ws.readyState === 1 && ws.send(JSON.stringify(o));

  ws.onmessage = async ev => {
    const m = JSON.parse(ev.data);
    if (m.type === 'error') {
      show('blocked');
      $('#blockedMsg').textContent = m.reason === 'full' ? 'Esta sala está cheia. O limite é de 15 pessoas.' : 'Sala não encontrada. Peça um novo link.';
      left = true;
    } else if (m.type === 'welcome') {
      myId = m.id; myName = m.name;
      m.peers.forEach(p => peers.set(p.id, mk(p.name, p.share)));
      show('room'); render();
    } else if (m.type === 'count') setCount(m.count);
    else if (m.type === 'peer-joined') {
      peers.set(m.peer.id, mk(m.peer.name, null));
      setCount(m.count);
      if (localStream) attachTracks(m.peer.id); // novo participante recebe vídeo e áudio
      render();
    } else if (m.type === 'peer-left') {
      closePeer(m.id); peers.delete(m.id); setCount(m.count); render();
    } else if (m.type === 'share') {
      const p = peers.get(m.id); if (p) { p.share = m.share; if (!m.share) p.stream = null; render(); }
    } else if (m.type === 'signal') onSignal(m.from, m.data);
  };
  ws.onclose = () => { if (!left) { show('blocked'); $('#blockedMsg').textContent = 'Conexão perdida com a sala.'; } };
  function setCount(n) { $('#count').textContent = '👥 ' + n + '/' + MAX + ' pessoas'; }

  // ---------- WebRTC ----------
  function getPeer(id) {
    const p = peers.get(id); if (!p) return null;
    if (p.pc) return p;
    p.polite = myId > id; p.making = false; p.ignore = false;
    const pc = p.pc = new RTCPeerConnection(ICE);
    pc.onicecandidate = e => e.candidate && wsSend({ type: 'signal', to: id, data: { candidate: e.candidate } });
    pc.onnegotiationneeded = async () => {
      try { p.making = true; await pc.setLocalDescription(); wsSend({ type: 'signal', to: id, data: { description: pc.localDescription } }); }
      catch (e) { console.error(e); } finally { p.making = false; }
    };
    pc.ontrack = e => {
      // mesmo alvo de buffer em áudio e vídeo: mantém a sincronia e absorve jitter sem muito atraso
      try { e.receiver.jitterBufferTarget = 100; } catch {}
      p.stream = e.streams[0]; render();
    };
    pc.onsignalingstatechange = () => { if (pc.signalingState === 'stable') tune(p); };
    pc.oniceconnectionstatechange = () => watchIce(id, p, pc);
    return p;
  }
  async function onSignal(id, data) {
    if (data.reset) return resetPeer(id, false);
    const p = getPeer(id); if (!p) return;
    const pc = p.pc;
    try {
      if (data.description) {
        const collision = data.description.type === 'offer' && (p.making || pc.signalingState !== 'stable');
        p.ignore = !p.polite && collision;
        if (p.ignore) return;
        await pc.setRemoteDescription(data.description);
        if (data.description.type === 'offer') {
          await pc.setLocalDescription();
          wsSend({ type: 'signal', to: id, data: { description: pc.localDescription } });
        }
      } else if (data.candidate) {
        try { await pc.addIceCandidate(data.candidate); } catch (e) { if (!p.ignore) throw e; }
      }
    } catch (e) { console.error(e); }
  }
  function closePeer(id) {
    const p = peers.get(id); if (!p) return;
    clearTimeout(p.tDisc); clearTimeout(p.tFail);
    if (p.pc) { p.pc.close(); p.pc = null; }
  }

  // Reconexão: restartIce primeiro; se não voltar em 10 s, recria o peer nos dois lados
  function watchIce(id, p, pc) {
    const st = pc.iceConnectionState;
    if (st === 'connected' || st === 'completed') { clearTimeout(p.tDisc); clearTimeout(p.tFail); p.tFail = null; }
    else if (st === 'disconnected') {
      clearTimeout(p.tDisc);
      p.tDisc = setTimeout(() => { if (p.pc === pc && pc.iceConnectionState === 'disconnected') pc.restartIce(); }, 3000);
    } else if (st === 'failed') {
      pc.restartIce();
      if (!p.tFail) p.tFail = setTimeout(() => {
        p.tFail = null;
        if (p.pc === pc && !['connected', 'completed'].includes(pc.iceConnectionState)) resetPeer(id, true);
      }, 10000);
    }
  }
  function resetPeer(id, notify) {
    const p = peers.get(id); if (!p || Date.now() - p.resetAt < 3000) return;
    p.resetAt = Date.now();
    closePeer(id); p.stream = null; p.senders = []; p.prev = {}; p.level = 0; p.bad = p.good = 0;
    if (notify) wsSend({ type: 'signal', to: id, data: { reset: true } });
    if (localStream) attachTracks(id);
    render();
  }

  // Parâmetros do sender: prioridade alta, fps/bitrate/resolução do degrau atual
  function tune(p) {
    if (!p.pc) return;
    const T = TIERS[p.level];
    for (const s of p.senders) {
      if (!s.track) continue;
      try {
        const prm = s.getParameters();
        if (!prm.encodings || !prm.encodings.length) prm.encodings = [{}];
        const e = prm.encodings[0];
        e.priority = e.networkPriority = 'high';
        if (s.track.kind === 'video') {
          e.maxBitrate = T.br; e.maxFramerate = T.fps;
          e.scaleResolutionDownBy = Math.max(1, capH / T.h);
          prm.degradationPreference = 'maintain-framerate';
        } else e.maxBitrate = 128000;
        s.setParameters(prm).catch(() => {});
      } catch {}
    }
  }
  function attachTracks(id) {
    const p = getPeer(id); if (!p || !localStream) return;
    for (const track of localStream.getTracks()) { // vídeo + áudio da tela
      const s = p.pc.addTrack(track, localStream);
      p.senders.push(s);
      if (track.kind === 'video') try { // H.264 primeiro (costuma ter encoder por hardware); os demais ficam como reserva
        const t = p.pc.getTransceivers().find(x => x.sender === s);
        const rank = c => /h264/i.test(c.mimeType) ? 0 : /vp8/i.test(c.mimeType) ? 1 : 2;
        t.setCodecPreferences([...RTCRtpSender.getCapabilities('video').codecs].sort((a, b) => rank(a) - rank(b)));
      } catch {}
    }
    tune(p);
  }

  // ---------- métricas reais (getStats) ----------
  const rate = m => {
    let r = 'good';
    if (m.loss > 1.5 || m.rtt > 180 || m.jitter > 30 || m.dropped > 3 || m.freezes > 0) r = 'warn';
    if (m.loss > 5 || m.rtt > 350 || m.freezes > 1) r = 'bad';
    return Object.assign({ r }, m);
  };
  function adapt(p, loss, rtt, reason) {
    const bad = loss > 0.04 || rtt > 300 || reason !== 'none';
    const good = loss < 0.01 && rtt < 150 && reason === 'none';
    if (bad) {
      p.good = 0;
      if (++p.bad >= 2 && p.level < TIERS.length - 1) { // 2 amostras ruins (4 s): desce um degrau
        p.level++; p.bad = 0;
        if (Date.now() - p.upAt < 30000) p.need = Math.min(p.need * 2, 60); // subiu e caiu logo: espera mais antes de tentar de novo
        tune(p);
      }
    } else if (good) {
      p.bad = 0;
      if (++p.good >= p.need && p.level > 0) { p.level--; p.good = 0; p.upAt = Date.now(); tune(p); } // ~20 s estáveis: sobe um degrau
      if (p.level === 0 && p.good > 30) p.need = 10;
    } else p.bad = 0;
  }
  async function pollStats() {
    for (const p of peers.values()) {
      if (!p.pc || !['connected', 'completed'].includes(p.pc.iceConnectionState)) continue;
      try {
        const st = await p.pc.getStats();
        let out, rin, inb, pair;
        st.forEach(r => {
          if (r.type === 'outbound-rtp' && r.kind === 'video') out = r;
          else if (r.type === 'remote-inbound-rtp' && r.kind === 'video') rin = r;
          else if (r.type === 'inbound-rtp' && r.kind === 'video') inb = r;
          else if (r.type === 'candidate-pair' && r.nominated && r.state === 'succeeded') pair = r;
        });
        const rtt = ((pair && pair.currentRoundTripTime) || (rin && rin.roundTripTime) || 0) * 1000;
        if (inb) { // quem recebe: perda, jitter, descartes e travamentos reais
          const pr = p.prev, dRecv = inb.packetsReceived - (pr.recv || 0), dLost = Math.max(0, inb.packetsLost - (pr.lost || 0));
          p.q = rate({ loss: dRecv + dLost > 0 ? 100 * dLost / (dRecv + dLost) : 0, rtt, jitter: (inb.jitter || 0) * 1000,
            dropped: (inb.framesDropped || 0) - (pr.drop || 0), freezes: (inb.freezeCount || 0) - (pr.frz || 0), fps: Math.round(inb.framesPerSecond || 0) });
          p.prev = { recv: inb.packetsReceived, lost: inb.packetsLost, drop: inb.framesDropped || 0, frz: inb.freezeCount || 0 };
        }
        if (out && localStream && p.senders.length) { // quem envia: adapta o degrau para este espectador
          const loss = (rin && rin.fractionLost) || 0;
          p.sq = rate({ loss: loss * 100, rtt, jitter: ((rin && rin.jitter) || 0) * 1000, dropped: 0, freezes: 0, fps: Math.round(out.framesPerSecond || 0) });
          adapt(p, loss, rtt, out.qualityLimitationReason || 'none');
        } else p.sq = null;
      } catch {}
    }
    paintQuality();
  }
  setInterval(pollStats, 2000);
  const LBL = { good: 'Boa', warn: 'Instável', bad: 'Problemas' };
  function paintQuality() {
    document.querySelectorAll('#grid .tile').forEach(el => {
      let q = null;
      if (el.dataset.key === 'me') {
        for (const p of peers.values()) if (p.sq && (!q || 'good,warn,bad'.indexOf(p.sq.r) > 'good,warn,bad'.indexOf(q.r))) q = p.sq;
      } else { const p = peers.get(el.dataset.key); q = p && p.q; }
      const box = el.querySelector('.qual');
      box.classList.toggle('hidden', !q);
      if (!q) return;
      box.className = 'qual ' + q.r;
      box.querySelector('b').textContent = LBL[q.r];
      box.title = 'RTT ' + Math.round(q.rtt) + ' ms • perda ' + q.loss.toFixed(1) + '% • jitter ' + Math.round(q.jitter) + ' ms • ' + q.fps + ' FPS';
    });
  }

  // ---------- compartilhamento (1080p / 60 FPS) ----------
  document.querySelectorAll('[data-share]').forEach(b => b.onclick = startShare);
  async function startShare() {
    if (localStream) return;
    try {
      localStream = await navigator.mediaDevices.getDisplayMedia({
        video: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 60 } }, audio: true });
    } catch { return; }
    const track = localStream.getVideoTracks()[0];
    track.contentHint = 'motion'; // jogos e vídeo: prefere manter a fluidez a manter a resolução
    track.onended = stopShare;
    const s = track.getSettings(); capH = s.height || 1080;
    const hasAudio = localStream.getAudioTracks().length > 0;
    myShare = capH + 'p • ' + Math.round(s.frameRate || 60) + ' FPS' + (hasAudio ? ' • com áudio' : ' • sem áudio');
    for (const [id, p] of peers) { p.level = 0; p.bad = p.good = 0; p.need = 10; attachTracks(id); }
    wsSend({ type: 'share', on: true, label: myShare });
    render();
  }
  $('#stopBtn').onclick = stopShare;
  function stopShare() {
    if (!localStream) return;
    localStream.getTracks().forEach(t => t.stop());
    localStream = null; myShare = null;
    for (const p of peers.values()) {
      if (p.pc) p.senders.forEach(s => { try { p.pc.removeTrack(s); } catch {} });
      p.senders = []; p.sq = null;
    }
    wsSend({ type: 'share', on: false });
    render();
  }

  // ---------- interface ----------
  const grid = $('#grid');
  const toggleFs = el => document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen && el.requestFullscreen().catch(() => {});
  function render() {
    const tiles = [];
    if (localStream) tiles.push({ key: 'me', name: 'Você (' + myName + ')', label: myShare, stream: localStream, muted: true });
    for (const [id, p] of peers) if (p.share && p.stream) tiles.push({ key: id, name: p.name, label: p.share, stream: p.stream });
    const keys = new Set(tiles.map(t => t.key));
    if (focusKey && !keys.has(focusKey)) focusKey = null;
    if (selKey && !keys.has(selKey)) selKey = null;
    [...grid.children].forEach(el => { if (!keys.has(el.dataset.key)) el.remove(); });
    for (const t of tiles) {
      let el = grid.querySelector('[data-key="' + t.key + '"]');
      if (!el) {
        el = document.createElement('div'); el.className = 'tile'; el.dataset.key = t.key;
        el.innerHTML = '<video autoplay playsinline></video><div class="qual hidden"><i></i><b></b></div>' +
          '<div class="ctl"><button type="button" class="snd"></button><button type="button" class="fo"></button><button type="button" class="fs" title="Tela cheia (F)">⛶</button></div>' +
          '<div class="who"><span></span><span></span></div>';
        grid.appendChild(el);
        const v0 = el.querySelector('video'), snd = el.querySelector('.snd');
        v0.muted = !!t.muted; // só a própria prévia fica muda (evita eco)
        el._paint = () => { snd.textContent = v0.muted ? '🔇 Ativar som' : '🔊'; };
        if (t.muted) snd.classList.add('hidden');
        else snd.onclick = () => { v0.muted = !v0.muted; el._paint(); v0.play().catch(() => {}); };
        el._paint();
        el.querySelector('.fo').onclick = () => { focusKey = focusKey === t.key ? null : t.key; render(); };
        el.querySelector('.fs').onclick = () => toggleFs(el);
        el.onclick = e => { if (!e.target.closest('.ctl')) { selKey = t.key; render(); } };
        el.ondblclick = e => { if (!e.target.closest('.ctl')) toggleFs(el); };
      }
      const v = el.querySelector('video');
      if (v.srcObject !== t.stream) {
        v.srcObject = t.stream;
        v.play().catch(err => { if (err && err.name === 'NotAllowedError') { v.muted = true; el._paint(); v.play().catch(() => {}); } });
      }
      const [a, b] = el.querySelectorAll('.who span');
      a.textContent = t.name; b.textContent = t.label;
      el.classList.toggle('big', t.key === focusKey);
      el.classList.toggle('sel', t.key === selKey && tiles.length > 1);
      el.querySelector('.fo').textContent = t.key === focusKey ? 'Voltar ao grid' : 'Focar';
    }
    grid.classList.toggle('focused', !!focusKey);
    grid.classList.toggle('hidden', !tiles.length);
    $('#empty').classList.toggle('hidden', !!tiles.length);
    $('#shareBtn').classList.toggle('hidden', !!localStream);
    $('#stopBtn').classList.toggle('hidden', !localStream);
  }

  const setCinema = on => { document.body.classList.toggle('cinema', on); };
  $('#cinema').onclick = () => setCinema(true);
  $('#exitCinema').onclick = () => setCinema(false);
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Escape' && !document.fullscreenElement) setCinema(false); // Esc em tela cheia é tratado pelo navegador
    else if (e.key.toLowerCase() === 'f' && !/INPUT|TEXTAREA/.test(e.target.tagName)) {
      if (document.fullscreenElement) return document.exitFullscreen();
      const el = grid.querySelector('[data-key="' + selKey + '"]') || grid.querySelector('.tile.big') || grid.querySelector('.tile');
      if (el) toggleFs(el);
    }
  });

  $('#copy').onclick = async e => {
    try { await navigator.clipboard.writeText(location.href); e.target.textContent = 'Link copiado'; }
    catch { prompt('Copie o link:', location.href); }
    setTimeout(() => e.target.textContent = 'Copiar link', 1800);
  };
  $('#leave').onclick = () => { left = true; stopShare(); ws.close(); peers.forEach((_, id) => closePeer(id)); location.href = '/'; };
}
